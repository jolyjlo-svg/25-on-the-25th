const cards=document.getElementById("cards"),now=new Date();
function unlocked(s){return now>=new Date(s+"T00:00:00")}
function until(s){let d=new Date(s+"T00:00:00").getTime()-Date.now();if(d<=0)return"UNLOCKED ♡";let a=Math.floor(d/86400000);d%=86400000;let h=Math.floor(d/3600000);d%=3600000;let m=Math.floor(d/60000);d%=60000;let sec=Math.floor(d/1000);return`${a}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(sec).padStart(2,"0")}s`}
function render(){cards.innerHTML="";letters.forEach((l,i)=>{let u=unlocked(l.date),c=document.createElement("section");c.className="card "+(!u?"locked":"");c.innerHTML=`<div class="date">${l.label}</div><div class="icon">${l.icon}</div><h2>${l.title}</h2><p>${l.teaser}</p><div class="status">${u?"✓ OPEN":"🔒 LOCKED"}</div>${u?`<button onclick="openLetter(${i})">Open Letter</button>`:`<button disabled>Not yet ♡</button><div class="countdown" id="count-${i}">${until(l.date)}</div>`}`;cards.appendChild(c)})}
